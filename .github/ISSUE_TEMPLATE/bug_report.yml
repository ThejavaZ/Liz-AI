name: Bug report
description: Something in Liz does not work as documented
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Before filing, please search [existing issues](https://github.com/ThejavaZ/Liz-AI/issues)
        to avoid duplicates. If this is a security issue, **do not open a
        public issue** — use the *Security report* template instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the bug happen?
      options:
        - CLI / commands
        - Tools (filesystem, terminal, calculator, notes, memory)
        - AI provider / tool calling
        - Memory, sessions or summarization
        - Voice (STT, TTS, wake word, listener)
        - Web search
        - Permissions / path sandbox
        - CI / tests
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear and concise description of the failure.
      placeholder: Liz returned "Permission denied" when reading a file inside the project...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands and inputs that trigger the bug.
      placeholder: |
        1. Set AI_PROVIDER=ollama
        2. Start `python main.py`
        3. Run `/tools`
        4. Ask Liz to read `src/liz/main.py`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The file should be read without asking for confirmation.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: |
        Paste the terminal output, error traceback or the `/doctor` and
        `/status` output (API keys are masked automatically).
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, provider and model.
      value: |
        - OS:
        - Python:
        - Provider / model:
        - Install method (pip -e, Docker):
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: This still happens on the latest `main`
          required: true
        - label: I did not commit secrets (`.env`, `*.db`) while debugging
