[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liz-ai"
version = "0.1.0"
description = "Personal AI assistant for Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
liz = "liz.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/liz"]
